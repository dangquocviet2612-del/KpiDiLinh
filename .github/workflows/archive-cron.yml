name: Scheduled Archive Cleanup

on:
  # Chạy thủ công khi cần kiểm tra hoặc dự phòng ngoài Vercel
  workflow_dispatch:
  # Nếu không triển khai trên Vercel, bỏ comment dòng bên dưới để GitHub Actions tự động kích hoạt:
  # schedule:
  #   - cron: '0 3 * * *' # 03:00 UTC (10:00 sáng VN) lệch giờ so với Vercel Cron

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Archive Purge Cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ARCHIVE_CRON_SECRET: ${{ secrets.ARCHIVE_CRON_SECRET || secrets.CRON_SECRET }}
        run: |
          if [ -n "$APP_URL" ] && [ -n "$ARCHIVE_CRON_SECRET" ]; then
            curl -f -s -X POST "$APP_URL/api/archive/cron" \
              -H "Authorization: Bearer $ARCHIVE_CRON_SECRET"
            echo "Archive purge triggered successfully."
          else
            echo "Skipping: APP_URL or ARCHIVE_CRON_SECRET is not configured in GitHub Secrets."
          fi
